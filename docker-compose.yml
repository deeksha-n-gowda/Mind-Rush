version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mindrush-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: mindrush
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindrush-api
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mindrush
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_HOURS=24
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data: